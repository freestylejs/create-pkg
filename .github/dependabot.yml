version: 2
updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
      open-pull-requests-limit: 10
      ignore:
          - dependency-name: '@changesets/cli'
            versions: ['3.x']
          - dependency-name: '@types/node'
            versions: ['26.x']
      groups:
          minor-and-patch:
              patterns: ['*']
              update-types: [minor, patch]
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      ignore:
          - dependency-name: changesets/action
            versions: ['2.x']
